name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # windows-latest guards the cp1252-console encoding path natively; the
    # subprocess tests reproduce it on Linux too, so both legs must stay green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        # The `dev` group supplies pytest + the fastapi/httpx HTTP-test deps; the
        # read-model tests are stdlib and run regardless. Model SDKs stay opt-in.
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest
