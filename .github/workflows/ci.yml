name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # windows-latest guards the cp1252-console encoding path natively; the
    # subprocess tests reproduce it on Linux too, so both legs must stay green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # fastapi + httpx back the optional read-API HTTP tests; the read-model
        # tests are stdlib and run even if these are absent (they importorskip).
        run: python -m pip install --upgrade pip pytest fastapi httpx

      - name: Run tests
        run: python -m pytest
