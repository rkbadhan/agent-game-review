name: Legacy

# Non-blocking by convention, not by configuration: the legacy evaluation tooling
# (see legacy/README.md) is kept runnable but is not part of the core path. Do not
# add this check to the required checks. A failure here is meant to be visible
# (red run, failure email), so the job deliberately has no continue-on-error.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "legacy/**"
      - "agr/moments.py"
      - ".github/workflows/legacy.yml"

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Run legacy tests
        run: uv run pytest legacy
