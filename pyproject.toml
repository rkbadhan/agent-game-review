[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-game-review"
version = "0.2.0"
description = "Deterministic core for Agent Game Review (post-hoc behavioural review of agent runs)."
requires-python = ">=3.10"

[project.scripts]
agr = "agr.cli:main"

# The core has no third-party runtime dependencies. Everything below is optional:
# `pip install .[api]` pulls in the HTTP transport; `.[test]` adds the client the
# HTTP tests use; `.[model-anthropic]` / `.[model-openai]` add a provider SDK for
# the Stage F model reviewer. The deterministic core and its tests never import
# any of them — the read-model and reviewer-envelope tests are pure stdlib.
[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest", "httpx>=0.24"]
# The model extras bundle python-dotenv so `agr review` auto-loads a .env file
# (credentials); the deterministic core still needs no third-party dependency.
model-anthropic = ["anthropic>=0.40", "python-dotenv>=1.0"]
model-openai = ["openai>=1.40", "python-dotenv>=1.0"]

# Contributor dev environment (PEP 735). `uv sync` installs this group by
# default, so one command gives the full deterministic + HTTP test suite. It
# mirrors the `api` + `test` extras; the model SDKs stay opt-in (`uv sync
# --all-extras` or `--extra model-anthropic`). `pip install .[api,test]` remains
# the equivalent for the non-uv path.
[dependency-groups]
dev = ["pytest", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23"]
# Browser gate (optional): Playwright drives the served SPA in a real Chromium
# (tests/test_ui.py). Kept out of `dev` so the default suite stays light; CI
# installs this group explicitly in the `browser` job.
browser = ["playwright>=1.40"]

# Explicit discovery: the flat layout has sibling `tests/` and `fixtures/`
# directories, so auto-discovery would refuse to guess. Ship the SPA asset as
# package data so `agr serve` works from an installed wheel, not just a checkout.
[tool.setuptools]
packages = ["agr"]

[tool.setuptools.package-data]
# The SPA is index.html + app.css + the per-phase JS modules under static/js/;
# all three must ship or the installed demo renders unstyled and dead (AGR-01:
# the wheel previously omitted the CSS and every script). demo_fixtures/*.json
# backs `agr demo-store`.
agr = ["static/*.html", "static/*.css", "static/js/*.js", "demo_fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
